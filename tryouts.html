<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NØV3X | Tryout Hub</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* =========================
           PARTICIPANTS SECTION
        ========================= */

        .participants-section {
            max-width: 960px;
            margin: 80px auto;
            padding: 0 20px;
        }

        .section-header {
            margin-bottom: 28px;
        }

        .section-header h2 {
            font-size: 28px;
            color: #fff;
            margin-bottom: 8px;
        }

        .section-header p {
            color: #777;
            font-size: 14px;
        }

        .participants-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .participant-card {
            display: grid;
            grid-template-columns: 70px 1fr auto auto;
            align-items: center;
            gap: 20px;

            padding: 22px;
            background: #08000d;
            border: 1px solid #24102d;

            transition: 0.2s ease;
        }

        .participant-card:hover {
            border-color: #71358c;
            transform: translateY(-2px);
        }

        .participant-number {
            color: #8d4baa;
            font-weight: bold;
            font-size: 14px;
        }

        .participant-info h3 {
            color: #fff;
            margin: 0 0 6px;
            font-size: 17px;
        }

        .participant-info p {
            color: #777;
            margin: 0;
            font-size: 13px;
        }

        .participant-details {
            display: flex;
            gap: 18px;
            color: #999;
            font-size: 11px;
        }

        .participant-status {
            border: 1px solid #633775;
            color: #a974bd;
            padding: 8px 14px;
            font-size: 11px;
            letter-spacing: 1px;
        }

        @media (max-width: 700px) {

            .participant-card {
                grid-template-columns: 50px 1fr;
            }

            .participant-details {
                grid-column: 2;
            }

            .participant-status {
                grid-column: 2;
                width: fit-content;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         NAVBAR
    ========================= -->

    <header class="navbar">

        <div class="logo">
            NØV3X
        </div>

        <nav>
            <a href="index.html">HOME</a>
            <a href="team.html">TEAM</a>
            <a href="scrims.html">SCRIMS</a>
            <a href="tryouts.html">TRYOUTS</a>
            <a href="#participants">PARTICIPANTS</a>
        </nav>

    </header>


    <!-- =========================
         TRYOUT FORM
    ========================= -->

    <main>

        <section class="tryout-section">

            <form id="tryoutForm">

                <div class="form-row">

                    <div class="form-group">
                        <label for="playerName">
                            PLAYER NAME
                        </label>

                        <input
                            type="text"
                            id="playerName"
                            placeholder="Enter your name"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="ign">
                            IN-GAME NAME / IGN
                        </label>

                        <input
                            type="text"
                            id="ign"
                            placeholder="Enter your IGN"
                            required
                        >
                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group">
                        <label for="role">
                            ROLE
                        </label>

                        <select id="role" required>
                            <option value="">Select role</option>
                            <option value="Slayer">Slayer</option>
                            <option value="SMG">SMG</option>
                            <option value="AR">AR</option>
                            <option value="Flex">Flex</option>
                            <option value="Sniper">Sniper</option>
                            <option value="Objective">Objective</option>
                        </select>
                    </div>


                    <div class="form-group">
                        <label for="age">
                            AGE
                        </label>

                        <input
                            type="number"
                            id="age"
                            placeholder="Enter age"
                            min="13"
                            required
                        >
                    </div>

                </div>


                <div class="form-group full-width">

                    <label for="experience">
                        EXPERIENCE / MESSAGE
                    </label>

                    <textarea
                        id="experience"
                        placeholder="Tell NØV3X about your experience..."
                        required
                    ></textarea>

                </div>


                <button type="submit">
                    SUBMIT TRYOUT APPLICATION
                </button>

            </form>

        </section>


        <!-- =========================
             PARTICIPANTS
        ========================= -->

        <section
            class="participants-section"
            id="participants"
        >

            <div class="section-header">

                <h2>
                    TRYOUT PARTICIPANTS
                </h2>

                <p>
                    Current players who have submitted a tryout application.
                </p>

            </div>


            <div
                class="participants-list"
                id="participantsList"
            >

                <!-- Participant 001 -->

                <div class="participant-card">

                    <div class="participant-number">
                        #001
                    </div>

                    <div class="participant-info">

                        <h3>
                            Joshien Gajunera
                        </h3>

                        <p>
                            IGN: NV3|Csh mPZ
                        </p>

                    </div>

                    <div class="participant-details">

                        <span>
                            ROLE: Flex
                        </span>

                        <span>
                            AGE: 18
                        </span>

                    </div>

                    <div class="participant-status">
                        PENDING
                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================= -->

    <footer>
        © 2026 NØV3X CORE
    </footer>


    <!-- =========================
         PARTICIPANT SCRIPT
    ========================= -->

    <script>

        const form = document.getElementById("tryoutForm");
        const participantsList =
            document.getElementById("participantsList");


        form.addEventListener("submit", function (event) {

            event.preventDefault();


            const playerName =
                document.getElementById("playerName").value;

            const ign =
                document.getElementById("ign").value;

            const role =
                document.getElementById("role").value;

            const age =
                document.getElementById("age").value;


            /*
             * Count existing participants
             */

            const participantCount =
                participantsList.children.length + 1;


            const number =
                String(participantCount).padStart(3, "0");


            /*
             * Create participant card
             */

            const participant =
                document.createElement("div");

            participant.className =
                "participant-card";


            participant.innerHTML = `

                <div class="participant-number">
                    #${number}
                </div>

                <div class="participant-info">

                    <h3>
                        ${playerName}
                    </h3>

                    <p>
                        IGN: ${ign}
                    </p>

                </div>

                <div class="participant-details">

                    <span>
                        ROLE: ${role}
                    </span>

                    <span>
                        AGE: ${age}
                    </span>

                </div>

                <div class="participant-status">
                    PENDING
                </div>

            `;


            /*
             * Add participant to list
             */

            participantsList.appendChild(participant);


            /*
             * Reset form
             */

            form.reset();


            /*
             * Scroll to participants
             */

            document
                .getElementById("participants")
                .scrollIntoView({
                    behavior: "smooth"
                });

        });

    </script>

</body>

</html>
