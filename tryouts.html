<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NØV3X | Tryout Hub</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #050008;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            height: 70px;
            border-bottom: 1px solid #24102d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            background: #050008;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            color: #888;
            text-decoration: none;
            font-size: 13px;
            transition: 0.2s;
        }

        nav a:hover {
            color: #fff;
        }

        /* ================= TRYOUT ================= */

        .tryout-section {
            max-width: 960px;
            margin: 0 auto;
            padding: 30px 34px 34px;
            border-left: 1px solid #24102d;
            border-right: 1px solid #24102d;
            border-bottom: 1px solid #24102d;
        }

        form {
            width: 100%;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-bottom: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .full-width {
            margin-top: 4px;
        }

        label {
            color: #999;
            font-size: 12px;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        input,
        select,
        textarea {
            width: 100%;
            background: #07000c;
            border: 1px solid #291333;
            color: #fff;
            padding: 13px;
            outline: none;
            font-size: 13px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #71358c;
        }

        select {
            appearance: auto;
        }

        textarea {
            min-height: 115px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            background: transparent;
            border: 1px solid #71358c;
            color: #fff;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #16051d;
            border-color: #a65bc4;
        }

        /* ================= PARTICIPANTS ================= */

        .participants-section {
            max-width: 960px;
            margin: 58px auto 80px;
        }

        .section-header {
            margin-bottom: 25px;
        }

        .section-header h2 {
            font-size: 27px;
            margin-bottom: 8px;
        }

        .section-header p {
            color: #777;
            font-size: 14px;
        }

        .participants-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .participant-card {
            display: grid;
            grid-template-columns: 70px 1fr auto auto;
            align-items: center;
            gap: 20px;

            padding: 22px;
            background: #08000d;
            border: 1px solid #24102d;

            transition: 0.2s ease;
        }

        .participant-card:hover {
            border-color: #71358c;
            transform: translateY(-2px);
        }

        .participant-number {
            color: #8d4baa;
            font-weight: bold;
            font-size: 14px;
        }

        .participant-info h3 {
            color: #fff;
            margin-bottom: 6px;
            font-size: 17px;
        }

        .participant-info p {
            color: #777;
            font-size: 13px;
        }

        .participant-details {
            display: flex;
            gap: 18px;
            color: #999;
            font-size: 11px;
        }

        .participant-status {
            border: 1px solid #633775;
            color: #a974bd;
            padding: 8px 14px;
            font-size: 11px;
            letter-spacing: 1px;
        }

        /* ================= FOOTER ================= */

        footer {
            border-top: 1px solid #24102d;
            padding: 24px;
            text-align: center;
            color: #555;
            font-size: 12px;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 700px) {

            .navbar {
                padding: 0 20px;
            }

            nav {
                gap: 12px;
            }

            nav a {
                font-size: 10px;
            }

            .tryout-section {
                padding: 25px 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .participants-section {
                padding: 0 20px;
            }

            .participant-card {
                grid-template-columns: 50px 1fr;
            }

            .participant-details {
                grid-column: 2;
            }

            .participant-status {
                grid-column: 2;
                width: fit-content;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->

    <header class="navbar">

        <div class="logo">
            NØV3X
        </div>

        <nav>
            <a href="index.html">HOME</a>
            <a href="team.html">TEAM</a>
            <a href="scrims.html">SCRIMS</a>
            <a href="tryouts.html">TRYOUTS</a>
            <a href="#participants">PARTICIPANTS</a>
        </nav>

    </header>


    <!-- TRYOUT FORM -->

    <main>

        <section class="tryout-section">

            <form id="tryoutForm">

                <div class="form-row">

                    <div class="form-group">
                        <label>PLAYER NAME</label>
                        <input
                            type="text"
                            id="playerName"
                            placeholder="Enter your name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>IN-GAME NAME / IGN</label>
                        <input
                            type="text"
                            id="ign"
                            placeholder="Enter your IGN"
                            required
                        >
                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group">
                        <label>ROLE</label>

                        <select id="role" required>
                            <option value="">Select role</option>
                            <option>Slayer</option>
                            <option>SMG</option>
                            <option>AR</option>
                            <option>Flex</option>
                            <option>Sniper</option>
                            <option>Objective</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>AGE</label>

                        <input
                            type="number"
                            id="age"
                            placeholder="Enter age"
                            min="13"
                            required
                        >
                    </div>

                </div>


                <div class="form-group full-width">

                    <label>EXPERIENCE / MESSAGE</label>

                    <textarea
                        id="experience"
                        placeholder="Tell NØV3X about your experience..."
                        required
                    ></textarea>

                </div>


                <button type="submit">
                    SUBMIT TRYOUT APPLICATION
                </button>

            </form>

        </section>


        <!-- PARTICIPANTS -->

        <section
            class="participants-section"
            id="participants"
        >

            <div class="section-header">

                <h2>TRYOUT PARTICIPANTS</h2>

                <p>
                    Current players who have submitted a tryout application.
                </p>

            </div>


            <div
                class="participants-list"
                id="participantsList"
            >

                <!-- Existing participant -->

                <div class="participant-card">

                    <div class="participant-number">
                        #001
                    </div>

                    <div class="participant-info">

                        <h3>
                            Joshien Gajunera
                        </h3>

                        <p>
                            IGN: NV3|Csh mPZ
                        </p>

                    </div>

                    <div class="participant-details">

                        <span>ROLE: Flex</span>
                        <span>AGE: 18</span>

                    </div>

                    <div class="participant-status">
                        PENDING
                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>
        © 2026 NØV3X CORE
    </footer>


    <!-- PARTICIPANT JAVASCRIPT -->

    <script>

        const form = document.getElementById("tryoutForm");
        const participantsList =
            document.getElementById("participantsList");

        form.addEventListener("submit", function(event) {

            event.preventDefault();

            const playerName =
                document.getElementById("playerName").value;

            const ign =
                document.getElementById("ign").value;

            const role =
                document.getElementById("role").value;

            const age =
                document.getElementById("age").value;

            const number =
                String(
                    participantsList.children.length + 1
                ).padStart(3, "0");

            const participant =
                document.createElement("div");

            participant.className =
                "participant-card";

            participant.innerHTML = `

                <div class="participant-number">
                    #${number}
                </div>

                <div class="participant-info">
                    <h3>${playerName}</h3>
                    <p>IGN: ${ign}</p>
                </div>

                <div class="participant-details">
                    <span>ROLE: ${role}</span>
                    <span>AGE: ${age}</span>
                </div>

                <div class="participant-status">
                    PENDING
                </div>

            `;

            participantsList.appendChild(participant);

            form.reset();

            document
                .getElementById("participants")
                .scrollIntoView({
                    behavior: "smooth"
                });

        });

    </script>

</body>
</html>
