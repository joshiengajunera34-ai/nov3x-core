<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NØV3X — TRYOUT HUB</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#08000f;
    color:#fff;
    min-height:100vh;
}

/* NAVBAR */
header{
    position:sticky;
    top:0;
    z-index:100;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 7%;
    background:#09000d;
    border-bottom:1px solid #24132f;
}

.logo{
    font-size:25px;
    font-weight:bold;
    letter-spacing:2px;
}

nav{
    display:flex;
    gap:25px;
}

nav a{
    color:#aaa;
    text-decoration:none;
    font-size:13px;
    transition:.2s;
}

nav a:hover{
    color:#fff;
}

/* HERO */
.hero{
    text-align:center;
    padding:90px 20px 60px;
}

.hero h1{
    font-size:48px;
    letter-spacing:3px;
    margin-bottom:15px;
}

.hero p{
    color:#999;
    font-size:16px;
}

/* CONTAINER */
.container{
    width:90%;
    max-width:1000px;
    margin:auto;
}

/* APPLICATION */
.application{
    background:#100018;
    border:1px solid #32133f;
    padding:35px;
    margin-bottom:60px;
}

.section-title{
    font-size:25px;
    margin-bottom:8px;
}

.section-subtitle{
    color:#888;
    margin-bottom:30px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.form-group.full{
    grid-column:1 / -1;
}

label{
    color:#bbb;
    font-size:13px;
}

input,
select,
textarea{
    width:100%;
    padding:14px;
    background:#08000f;
    color:#fff;
    border:1px solid #3a1a47;
    outline:none;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#8d45a8;
}

textarea{
    min-height:120px;
    resize:vertical;
}

select{
    cursor:pointer;
}

option{
    background:#100018;
}

.submit-btn{
    margin-top:25px;
    width:100%;
    padding:15px;
    background:transparent;
    color:#fff;
    border:1px solid #8d45a8;
    cursor:pointer;
    font-weight:bold;
    letter-spacing:1px;
    transition:.2s;
}

.submit-btn:hover{
    background:#8d45a8;
}

/* APPLICANTS */
.applicants{
    padding-bottom:70px;
}

.applicant-header{
    margin-bottom:25px;
}

.applicant-header h2{
    font-size:27px;
}

.applicant-header p{
    color:#777;
    margin-top:7px;
}

.applicant-list{
    display:grid;
    gap:15px;
}

.applicant{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:22px;
    background:#100018;
    border:1px solid #291333;
}

.applicant-info h3{
    margin-bottom:6px;
}

.applicant-info p{
    color:#777;
    font-size:13px;
}

.status{
    padding:8px 13px;
    border:1px solid #644070;
    color:#c89ddd;
    font-size:12px;
}

/* EMPTY STATE */
.empty{
    text-align:center;
    padding:35px;
    color:#666;
    border:1px dashed #291333;
}

/* FOOTER */
footer{
    text-align:center;
    padding:25px;
    border-top:1px solid #24132f;
    color:#555;
    font-size:13px;
}

/* MOBILE */
@media(max-width:700px){

    header{
        padding:18px 5%;
    }

    nav{
        gap:12px;
    }

    nav a{
        font-size:11px;
    }

    .hero{
        padding:65px 15px 45px;
    }

    .hero h1{
        font-size:34px;
    }

    .application{
        padding:22px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

    .applicant{
        align-items:flex-start;
        gap:15px;
        flex-direction:column;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">NØV3X</div>

    <nav>
        <a href="index.html">HOME</a>
        <a href="players.html">TEAM</a>
        <a href="index.html#scrims">SCRIMS</a>
        <a href="tryouts.html">TRYOUTS</a>
    </nav>
</header>


<section class="hero">
    <h1>TRYOUT HUB</h1>
    <p>Apply to become part of NØV3X CORE.</p>
</section>


<main class="container">

<section class="application">

    <h2 class="section-title">APPLY FOR TRYOUT</h2>

    <p class="section-subtitle">
        Submit your information below. Applications will appear in the applicant list.
    </p>

    <form id="tryoutForm">

        <div class="form-grid">

            <div class="form-group">
                <label>PLAYER NAME</label>
                <input
                    type="text"
                    id="playerName"
                    placeholder="Enter your name"
                    required>
            </div>

            <div class="form-group">
                <label>IN-GAME NAME / IGN</label>
                <input
                    type="text"
                    id="ign"
                    placeholder="Enter your IGN"
                    required>
            </div>

            <div class="form-group">
                <label>ROLE</label>

                <select id="role" required>
                    <option value="">Select role</option>
                    <option>Assault</option>
                    <option>Support</option>
                    <option>Sniper</option>
                    <option>IGL</option>
                    <option>Flex</option>
                </select>
            </div>

            <div class="form-group">
                <label>AGE</label>
                <input
                    type="number"
                    id="age"
                    min="13"
                    max="99"
                    placeholder="Enter age"
                    required>
            </div>

            <div class="form-group full">
                <label>EXPERIENCE / MESSAGE</label>

                <textarea
                    id="message"
                    placeholder="Tell NØV3X about your experience..."></textarea>
            </div>

        </div>

        <button type="submit" class="submit-btn">
            SUBMIT TRYOUT APPLICATION
        </button>

    </form>

</section>


<section class="applicants">

    <div class="applicant-header">
        <h2>TRYOUT APPLICANTS</h2>

        <p>
            Current players who have submitted a tryout application.
        </p>
    </div>

    <div id="applicantList" class="applicant-list">

        <div class="empty" id="emptyMessage">
            No applications yet.
        </div>

    </div>

</section>

</main>


<footer>
    © 2026 NØV3X CORE
</footer>


<script>

const form = document.getElementById("tryoutForm");
const applicantList = document.getElementById("applicantList");
const emptyMessage = document.getElementById("emptyMessage");

let applicants =
    JSON.parse(localStorage.getItem("nov3xApplicants")) || [];


function displayApplicants(){

    applicantList.innerHTML = "";

    if(applicants.length === 0){

        applicantList.innerHTML = `
            <div class="empty">
                No applications yet.
            </div>
        `;

        return;
    }

    applicants.forEach((applicant, index) => {

        const card = document.createElement("div");

        card.className = "applicant";

        card.innerHTML = `

            <div class="applicant-info">

                <h3>
                    #${String(index + 1).padStart(3,"0")}
                    — ${escapeHTML(applicant.name)}
                </h3>

                <p>
                    IGN: ${escapeHTML(applicant.ign)}
                    • ROLE: ${escapeHTML(applicant.role)}
                </p>

            </div>

            <div class="status">
                PENDING
            </div>
        `;

        applicantList.appendChild(card);
    });
}


form.addEventListener("submit", function(event){

    event.preventDefault();

    const applicant = {

        name:
            document.getElementById("playerName").value.trim(),

        ign:
            document.getElementById("ign").value.trim(),

        role:
            document.getElementById("role").value,

        age:
            document.getElementById("age").value,

        message:
            document.getElementById("message").value.trim()
    };


    applicants.push(applicant);

    localStorage.setItem(
        "nov3xApplicants",
        JSON.stringify(applicants)
    );


    form.reset();

    displayApplicants();

    alert("TRYOUT APPLICATION SUBMITTED.");
});


function escapeHTML(text){

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


displayApplicants();

</script>

</body>
</html>
