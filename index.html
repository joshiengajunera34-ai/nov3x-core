<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NØV3X CORE</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #08000f;
    color: white;
    min-height: 100vh;
}

/* NAVBAR */
header {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: rgba(8, 0, 15, 0.95);
    border-bottom: 1px solid #24112f;
    padding: 22px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    letter-spacing: 3px;
}

nav {
    display: flex;
    gap: 25px;
}

nav a {
    color: #aaa;
    text-decoration: none;
    font-size: 14px;
    transition: 0.3s;
}

nav a:hover {
    color: white;
}

/* HERO */
.hero {
    min-height: 80vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 80px 20px;
    background:
        radial-gradient(circle at center, #260035 0%, #08000f 65%);
}

.hero h1 {
    font-size: clamp(50px, 10vw, 100px);
    letter-spacing: 12px;
    margin-bottom: 15px;
}

.hero p {
    color: #999;
    font-size: 17px;
    margin-bottom: 35px;
}

.button {
    display: inline-block;
    padding: 14px 30px;
    border: 1px solid #9d42ff;
    color: white;
    text-decoration: none;
    transition: 0.3s;
    background: transparent;
}

.button:hover {
    background: #9d42ff;
    box-shadow: 0 0 25px rgba(157, 66, 255, 0.35);
}

/* SECTIONS */
section {
    padding: 90px 7%;
}

.section-title {
    text-align: center;
    font-size: 38px;
    margin-bottom: 12px;
}

.section-subtitle {
    text-align: center;
    color: #888;
    margin-bottom: 40px;
}

/* CORE */
.core-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    max-width: 950px;
    margin: auto;
}

.player-card {
    background: rgba(255,255,255,0.02);
    border: 1px solid #281537;
    padding: 40px 20px;
    text-align: center;
    transition: 0.3s;
}

.player-card:hover {
    transform: translateY(-5px);
    border-color: #9d42ff;
}

.player-card h3 {
    font-size: 20px;
    margin-bottom: 10px;
}

.player-card p {
    color: #888;
    font-size: 14px;
}

/* FULL TEAM */
.full-team {
    text-align: center;
    margin-top: 35px;
}

/* SCRIMS */
.scrim-section {
    background: #0c0015;
}

.scrim-card {
    max-width: 850px;
    margin: auto;
    border: 1px solid #281537;
    padding: 45px;
    text-align: center;
}

.scrim-card h3 {
    font-size: 28px;
    margin-bottom: 15px;
}

.scrim-card p {
    color: #888;
    margin-bottom: 30px;
}

/* TRYOUT HUB */
.tryout-section {
    text-align: center;
}

.tryout-box {
    max-width: 850px;
    margin: auto;
    border: 1px solid #281537;
    padding: 55px 30px;
    background: rgba(255,255,255,0.02);
}

.tryout-box h3 {
    font-size: 30px;
    margin-bottom: 15px;
}

.tryout-box p {
    color: #888;
    margin-bottom: 30px;
}

/* FOOTER */
footer {
    border-top: 1px solid #24112f;
    padding: 30px;
    text-align: center;
    color: #555;
    font-size: 14px;
}

/* MOBILE */
@media (max-width: 700px) {

    header {
        padding: 18px 5%;
    }

    nav {
        gap: 12px;
    }

    nav a {
        font-size: 11px;
