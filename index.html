<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NØV3X CORE</title><style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background: #080808;
        color: white;
        min-height: 100vh;
    }

    header {
        padding: 25px 8%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #222;
    }

    .logo {
        font-size: 25px;
        font-weight: bold;
        letter-spacing: 3px;
    }

    nav a {
        color: #aaa;
        text-decoration: none;
        margin-left: 25px;
        transition: 0.3s;
    }

    nav a:hover {
        color: white;
    }

    .hero {
        min-height: 80vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 20px;
    }

    .hero h1 {
        font-size: clamp(50px, 10vw, 110px);
        letter-spacing: 10px;
        margin-bottom: 15px;
    }

    .hero p {
        color: #888;
        font-size: 18px;
        margin-bottom: 30px;
    }

    .btn {
        display: inline-block;
        padding: 14px 30px;
        border: 1px solid white;
        color: white;
        text-decoration: none;
        transition: 0.3s;
    }

    .btn:hover {
        background: white;
        color: black;
    }

    section {
        padding: 70px 8%;
        text-align: center;
    }

    section h2 {
        font-size: 35px;
        margin-bottom: 30px;
    }

    .cards {
        display: flex;
        justify-content: center;
        gap: 20px;
        flex-wrap: wrap;
    }

    .card {
        width: 250px;
        padding: 30px;
        background: #111;
        border: 1px solid #222;
    }

    .card h3 {
        margin-bottom: 10px;
    }

    .card p {
        color: #777;
    }

    footer {
        padding: 25px;
        text-align: center;
        color: #555;
        border-top: 1px solid #222;
    }
</style>

</head><body><header>
    <div class="logo">NØV3X</div>

    <nav>
        <a href="#home">HOME</a>
        <a href="#team">TEAM</a>
        <a href="#contact">CONTACT</a>
    </nav>
</header>

<main id="home">

    <div class="hero">
        <h1>NØV3X</h1>
        <p>ONE SQUAD. ONE FATE.</p>
        <a href="#team" class="btn">ENTER CORE</a>
    </div>

    <section id="team">
        <h2>THE CORE</h2>

        <div class="cards">
            <div class="card">
                <h3>PLAYER 01</h3>
                <p>TEAM CAPTAIN</p>
            </div>

            <div class="card">
                <h3>PLAYER 02</h3>
                <p>ASSAULT</p>
            </div>

            <div class="card">
                <h3>PLAYER 03</h3>
                <p>SUPPORT</p>
            </div>
        </div>
    </section>

    <section id="contact">
        <h2>JOIN THE CORE</h2>
        <p style="color:#777; margin-bottom:25px;">
            Ready to enter the next level?
        </p>

        <a href="#" class="btn">CONTACT US</a>
    </section>

</main>

<footer>
    © 2026 NØV3X CORE
</footer>

</body>
</html>
